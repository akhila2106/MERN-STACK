<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child {
            background-color: aquamarine;
            border: 2px solid #a577cf;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }

        .childContainer {
            background-color: #58d1a9;
            margin: 14px;
            padding: 14px;
            border: 2px solid antiquewhite;
        }

        .container {
            background-color: #19b682;
            margin: 14px;
            padding: 14px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", e => {
            e.stopPropagation()
            alert("child was clicked")

        })
        document.querySelector(".childContainer").addEventListener("click", e => {
            e.stopPropagation()
            alert("child  Container was clicked")
        })
        document.querySelector(".container").addEventListener("click", e => {
            alert("container was clicked")
        })
        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1},${val2},${val3})`
        }
        // let a = setInterval(()=>{
        //     document.querySelector(".childContainer").style.background = getRandomColor();
        // },1000);
        // let b = setInterval(()=>{
        //     document.querySelector(".child").style.color=getRandomColor()
        // },1000);
        setTimeout(()=>{
            document.querySelector(".child").style.background=getRandomColor();
        },2000);
    </script>
</body>

</html>
